name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm OIDC trusted publishing)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Publish @ashtrath/oxlint-plugin-slop
        run: |
          bun pm pack --destination .
          npm publish ashtrath-oxlint-plugin-slop-*.tgz --access public --force
        working-directory: packages/oxlint-plugin-slop

      - name: Publish @ashtrath/oxc-config
        run: |
          bun pm pack --destination .
          npm publish ashtrath-oxc-config-*.tgz --access public --force
        working-directory: packages/oxc-config
